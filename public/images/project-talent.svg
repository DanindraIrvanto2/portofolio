<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="talentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="20" fill="url(#talentBg)" />
  <circle cx="650" cy="150" r="140" fill="#f43f5e" opacity="0.15" filter="blur(50px)" />
  
  <!-- Camera Viewfinder overlay -->
  <rect x="100" y="70" width="600" height="360" rx="16" fill="none" stroke="rgba(244,63,94,0.3)" stroke-width="2" stroke-dasharray="16 8" />
  <!-- Corner ticks -->
  <path d="M120 120 L120 90 L150 90" stroke="#f43f5e" stroke-width="3" fill="none" />
  <path d="M680 120 L680 90 L650 90" stroke="#f43f5e" stroke-width="3" fill="none" />
  <path d="M120 380 L120 410 L150 410" stroke="#f43f5e" stroke-width="3" fill="none" />
  <path d="M680 380 L680 410 L650 410" stroke="#f43f5e" stroke-width="3" fill="none" />
  
  <!-- REC tag -->
  <circle cx="150" cy="120" r="7" fill="#ef4444" />
  <text x="170" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">REC [00:14:32]</text>
  <text x="640" y="125" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="end">4K • 60 FPS</text>
  
  <!-- Center focal cross -->
  <circle cx="400" cy="250" r="60" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
  <line x1="400" y1="230" x2="400" y2="270" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
  <line x1="380" y1="250" x2="420" y2="250" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
  
  <!-- Lower banner -->
  <rect x="200" y="340" width="400" height="50" rx="12" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.1)" />
  <text x="400" y="370" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">PROMOTIONAL VIDEO &amp; COMMERCIAL TALENT</text>
</svg>
