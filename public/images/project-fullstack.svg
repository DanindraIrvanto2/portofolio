<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fullstackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="20" fill="url(#fullstackBg)" />
  <circle cx="650" cy="380" r="160" fill="#10b981" opacity="0.12" filter="blur(60px)" />
  
  <!-- Code & Dashboard UI Mockup -->
  <rect x="80" y="60" width="640" height="380" rx="14" fill="#06131d" stroke="rgba(16,185,129,0.2)" stroke-width="1.5" />
  <rect x="80" y="60" width="640" height="40" rx="14" fill="#0b1e2d" />
  <circle cx="110" cy="80" r="5" fill="#ef4444" />
  <circle cx="126" cy="80" r="5" fill="#f59e0b" />
  <circle cx="142" cy="80" r="5" fill="#10b981" />
  <text x="400" y="85" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">api/v1/auth/database-schema.prisma</text>
  
  <!-- Left code panel -->
  <rect x="105" y="120" width="280" height="290" rx="10" fill="#040b12" stroke="rgba(255,255,255,0.06)" />
  <line x1="125" y1="150" x2="220" y2="150" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="125" y1="180" x2="330" y2="180" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
  <line x1="145" y1="210" x2="280" y2="210" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  <line x1="145" y1="240" x2="310" y2="240" stroke="#f472b6" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  <line x1="145" y1="270" x2="250" y2="270" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  <line x1="125" y1="300" x2="200" y2="300" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="125" y1="330" x2="290" y2="330" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" opacity="0.5" />
  
  <!-- Right dashboard metrics -->
  <rect x="405" y="120" width="290" height="135" rx="10" fill="#0b1e2d" stroke="rgba(16,185,129,0.2)" />
  <text x="430" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">API HEALTH &amp; DB LATENCY</text>
  <text x="430" y="190" fill="#10b981" font-family="system-ui, sans-serif" font-size="28" font-weight="black">99.98%</text>
  <text x="430" y="225" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13">12ms average response time</text>
  
  <rect x="405" y="275" width="290" height="135" rx="10" fill="#0b1e2d" stroke="rgba(56,189,248,0.2)" />
  <text x="430" y="305" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">AUTH &amp; SECURITY</text>
  <text x="430" y="345" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="28" font-weight="black">JWT &amp; REST</text>
  <text x="430" y="380" fill="#10b981" font-family="system-ui, sans-serif" font-size="13">Prisma ORM • PostgreSQL</text>
</svg>
