<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="20" fill="url(#studioBg)" />
  <circle cx="200" cy="150" r="130" fill="#818cf8" opacity="0.12" filter="blur(50px)" />
  
  <!-- Studio audio/video console mockup -->
  <rect x="80" y="70" width="640" height="360" rx="14" fill="#0b0f19" stroke="rgba(129,140,248,0.2)" stroke-width="1.5" />
  
  <!-- Audio equalizer bars -->
  <g transform="translate(120, 130)">
    <rect x="0" y="50" width="12" height="100" rx="4" fill="#3b82f6" />
    <rect x="25" y="20" width="12" height="130" rx="4" fill="#6366f1" />
    <rect x="50" y="40" width="12" height="110" rx="4" fill="#8b5cf6" />
    <rect x="75" y="10" width="12" height="140" rx="4" fill="#ec4899" />
    <rect x="100" y="35" width="12" height="115" rx="4" fill="#3b82f6" />
    <rect x="125" y="70" width="12" height="80" rx="4" fill="#10b981" />
    <rect x="150" y="15" width="12" height="135" rx="4" fill="#f59e0b" />
    <rect x="175" y="45" width="12" height="105" rx="4" fill="#8b5cf6" />
  </g>
  
  <!-- Camera switch buttons -->
  <rect x="360" y="130" width="150" height="85" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
  <text x="435" y="170" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CAM 1: MASTER</text>
  <circle cx="380" cy="150" r="5" fill="#ef4444" />
  
  <rect x="530" y="130" width="150" height="85" rx="10" fill="#111827" stroke="rgba(255,255,255,0.1)" />
  <text x="605" y="170" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CAM 2: TALENT</text>
  
  <rect x="360" y="235" width="320" height="140" rx="10" fill="#111827" stroke="rgba(255,255,255,0.06)" />
  <text x="385" y="270" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="13">TRANSMISSION FEED &amp; ROUTING</text>
  <text x="385" y="310" fill="#10b981" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">BROADCAST SIGNAL: OPTIMAL</text>
  <text x="385" y="345" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="13">Audio Bitrate: 320kbps • Video: 1080p60</text>
</svg>
