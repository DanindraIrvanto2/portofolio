<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="20" fill="url(#bgGrad)" />
  <circle cx="700" cy="100" r="150" fill="#6366f1" opacity="0.15" filter="blur(40px)" />
  <circle cx="100" cy="400" r="120" fill="#a855f7" opacity="0.15" filter="blur(40px)" />
  
  <!-- Interface mockup -->
  <rect x="80" y="60" width="640" height="380" rx="14" fill="#090d16" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  
  <!-- Window bar -->
  <rect x="80" y="60" width="640" height="40" rx="14" fill="#131927" />
  <circle cx="110" cy="80" r="5" fill="#ef4444" />
  <circle cx="126" cy="80" r="5" fill="#f59e0b" />
  <circle cx="142" cy="80" r="5" fill="#10b981" />
  <rect x="250" y="70" width="300" height="20" rx="10" fill="#1e293b" opacity="0.6" />
  
  <!-- Content cards -->
  <rect x="110" y="120" width="380" height="200" rx="10" fill="#141c2e" stroke="rgba(99,102,241,0.3)" />
  <!-- Video Player Preview -->
  <circle cx="300" cy="220" r="30" fill="url(#accentGrad)" opacity="0.9" />
  <polygon points="293,208 315,220 293,232" fill="#ffffff" />
  
  <!-- Live Tag -->
  <rect x="130" y="140" width="60" height="22" rx="6" fill="#ef4444" />
  <text x="160" y="155" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LIVE ON</text>
  
  <!-- Sidebar list -->
  <rect x="510" y="120" width="180" height="40" rx="8" fill="#1e293b" opacity="0.7" />
  <rect x="510" y="170" width="180" height="40" rx="8" fill="#1e293b" opacity="0.5" />
  <rect x="510" y="220" width="180" height="40" rx="8" fill="#1e293b" opacity="0.4" />
  <rect x="510" y="270" width="180" height="50" rx="8" fill="#1e293b" opacity="0.3" />
  
  <!-- Bottom controls -->
  <rect x="110" y="340" width="580" height="70" rx="10" fill="#111827" stroke="rgba(255,255,255,0.06)" />
  <rect x="130" y="365" width="160" height="18" rx="6" fill="#374151" />
  <rect x="310" y="365" width="220" height="18" rx="6" fill="#374151" opacity="0.6" />
  <rect x="560" y="358" width="110" height="32" rx="8" fill="url(#accentGrad)" />
  <text x="615" y="378" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">STREAM</text>
</svg>
